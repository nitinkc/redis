apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: example.artifactory.com/docker/poc-backend
    newName: your.artifactory.com/docker/poc-backend
    newTag: latest
  - name: example.artifactory.com/docker/poc-ui
    newName: your.artifactory.com/docker/poc-ui
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: poc-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: us-central1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: poc-cluster-b
