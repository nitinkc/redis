apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: poc-redis
  template:
    metadata:
      labels:
        app: poc-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: poc-redis
spec:
  selector:
    app: poc-redis
  ports:
    - port: 6379
      targetPort: 6379
