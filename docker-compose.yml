services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      REGION: local
      CLUSTER_NAME: docker-compose
    depends_on:
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
